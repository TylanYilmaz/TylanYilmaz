name: generate snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate snake svgs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: TylanYilmaz
          outputs: |
            dist/snake-dark.svg?color_snake=%2300FF41&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353
            dist/snake-light.svg?color_snake=%23216E39&color_dots=%23EBEDF0,%239BE9A8,%2340C463,%2330A14E,%23216E39

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
